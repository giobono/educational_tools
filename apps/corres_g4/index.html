<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CorRes G4 — researcher's version</title>
<link rel="stylesheet" href="../../ebono_brand.css">
<link rel="stylesheet" href="../../edu_common.css">
<link rel="stylesheet" href="corres_g4.css">
<!--
  CorRes G4, the researcher's version. Build brief v0.2 §8.

  WHAT IS AND IS NOT IN THIS FILE. No sentence here describes the method:
  they all live in method_strings.js, so AD can sight one file (Charter §2.3).
  This file holds structure, plumbing and the four-part page shape. If you
  find yourself writing a sentence about what a step does, it belongs there.

  THE FOUR PARTS, in this order on every step, never reordered:
    1. what was done
    2. the one thing to look at
    3. flags, as Stop / Caution / Note
    4. the decision, default pre-selected, with a consequence per option

  THE ANALYSIS IS SERVER-SIDE. Every number on screen comes from artie over
  /v2/corres. Nothing is computed here.
-->
</head>
<body>
<!-- The site header is a shared fragment, loaded the way every other app
     loads it: id and class must match, or edu_common.js cannot fill it. -->
<div id="edu-header" class="cr-nav"></div>

<main class="edu-wrap">

  <div id="g4-unsighted" class="g4-unsighted" hidden>
    <strong>Not yet sighted by AD.</strong>
    <span id="g4-unsighted-detail"></span>
  </div>

  <h1>CorRes <span class="g4-num">G4</span></h1>
  <p id="g4-intro" class="g4-did"></p>

  <div class="g4-layout">

    <!-- the rail: where you are, and the run history (§8 navigation) -->
    <nav class="g4-rail" aria-label="Steps and runs">
      <h2>Steps</h2>
      <ol id="g4-rail-steps"></ol>
      <div class="g4-runs">
        <h2>Runs</h2>
        <ul id="g4-rail-runs"></ul>
        <p><button type="button" id="g4-new-run" class="edu-btn-secondary">Start a new run</button></p>
      </div>
    </nav>

    <!-- one step pane, re-rendered per step -->
    <section class="g4-step" id="g4-pane" aria-live="polite">
      <h1><span class="g4-num" id="g4-step-num"></span> <span id="g4-step-title"></span></h1>

      <!-- part 1 -->
      <div class="g4-part">
        <h2>What was done</h2>
        <p class="g4-did" id="g4-did"></p>
      </div>

      <!-- part 2 -->
      <div class="g4-part">
        <h2 id="g4-focus-heading">The one thing to look at</h2>
        <p class="g4-did" id="g4-look-at"></p>
        <div class="g4-focus" id="g4-focus"></div>
      </div>

      <!-- part 3 -->
      <div class="g4-part" id="g4-flags-part">
        <h2>Flags</h2>
        <div id="g4-flags"></div>
      </div>

      <!-- part 4 -->
      <div class="g4-part g4-decision" id="g4-decision-part">
        <h2>Your decision</h2>
        <div id="g4-decision"></div>
      </div>

      <div class="g4-part">
        <p class="g4-running" id="g4-running" hidden></p>
        <button type="button" id="g4-run" class="edu-btn">Run this step</button>
        <button type="button" id="g4-cancel" class="edu-btn-secondary" hidden>Cancel</button>
        <button type="button" id="g4-next" class="edu-btn-secondary" hidden>Next step</button>
      </div>

      <p class="g4-provisional" id="g4-provisional"></p>
    </section>
  </div>
</main>

<script src="config.php"></script>
<script src="../../edu_common.js"></script>
<script src="method_strings.js"></script>
<script src="g4_api.js"></script>
<script src="corres_g4.js"></script>
</body>
</html>
